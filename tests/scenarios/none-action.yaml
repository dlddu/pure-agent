name: none-action
description: "actions: [\"none\"] → Export Handler는 추가 액션 없이 종료"
level: [unit, integration, e2e]

# ── Unit/Integration: mock run 정의 ──
run:
  environment_id: "default"
  export_config:
    summary: "No action needed. Task already completed."
    actions:
      - "none"
    session_id: "mock-session-none"
  agent_result: "No action needed. Task already completed."

# ── E2E: real API 실행 설정 ──
real:
  prompt: "아무 외부 액션 없이 종료해주세요. export_config의 actions는 [\"none\"]으로 설정하세요."
  setup: []
  verify: [planner_valid_image, s3_transcript]
  teardown: []

# ── 공유 assertions ──
assertions:
  planner_image: "default"
  export_handler_exit: 0
